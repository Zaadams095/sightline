# Free compile check on a GitHub macOS runner before spending an EAS build credit.
# Mirrors the EAS iOS build (tunnel xcframework, prebuild, pods, xcodebuild) minus signing.
name: iOS compile check

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0 # keep in sync with app/eas.json build.production.node
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: tunnel/go.mod
          cache-dependency-path: tunnel/go.sum

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install JS dependencies (same as EAS)
        run: npm ci --include=dev

      - name: Build WireGuard tunnel xcframework
        run: EAS_BUILD_PLATFORM=ios bash scripts/build-tunnel-ios.sh

      - name: Typecheck & lint
        run: |
          npx tsc --noEmit
          npx expo lint

      - name: Make sure the watchOS platform is installed (embedded Apple Watch app)
        run: |
          xcodebuild -showsdks | grep -E "watch|iphone" || true
          bash scripts/ensure-watchos-sdk.sh

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install pods
        run: cd ios && pod install

      # No -sdk flag: it would force every target onto the iPhone SDK. With only a destination,
      # Xcode builds the iPhone targets for the iOS simulator and the embedded watch app for
      # the watchOS simulator, the same way an archive builds them for devices.
      - name: Compile app + extensions + watch app (simulator, unsigned)
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../xcodebuild.log | grep -E "error:|warning: .*Swift|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ../xcodebuild.log
          # The watch app must really be embedded (Embed Watch Content).
          APP=$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 5 -type d -path '*/Release-iphonesimulator/*.app' | head -1)
          echo "Built $APP"
          ls "$APP/Watch" || { echo "::error::The Apple Watch app wasn't embedded"; exit 1; }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
