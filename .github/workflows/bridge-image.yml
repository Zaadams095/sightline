# Builds the Sightline Hub (formerly the Instant Alerts bridge) and publishes it to GitHub
# Container Registry under both names: existing installs keep pulling sightline-bridge, new
# installs and the Home Assistant add-on use sightline-hub. Same image.
name: Hub image

on:
  push:
    branches: [main]
    paths: ['bridge/**', '.github/workflows/bridge-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Test
        working-directory: bridge
        run: go vet ./... && go vet -tags notsnet ./... && go test ./...

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 for PCs/NAS boxes, arm64 for Raspberry Pi and similar Frigate hosts.
      - uses: docker/build-push-action@v6
        with:
          context: bridge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/zaadams095/sightline-bridge:latest
            ghcr.io/zaadams095/sightline-bridge:${{ github.sha }}
            ghcr.io/zaadams095/sightline-hub:latest
            ghcr.io/zaadams095/sightline-hub:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
