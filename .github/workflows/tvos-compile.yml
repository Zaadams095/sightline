# Free compile check for the Apple TV app (tv/, a separate Expo project on react-native-tvos)
# before spending an EAS build credit. Independent of the iOS check: the iPhone app is untouched.
name: tvOS compile check

on:
  push:
    branches: [main]
    paths:
      - 'tv/**'
      - '.github/workflows/tvos-compile.yml'
  workflow_dispatch:

concurrency:
  group: tvos-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tvos:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0 # keep in sync with tv/eas.json build.production.node
          cache: npm
          cache-dependency-path: tv/package-lock.json

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Make sure the tvOS platform is installed
        run: |
          if ! xcodebuild -showsdks | grep -q -- '-sdk appletvsimulator'; then
            xcodebuild -downloadPlatform tvOS
          fi

      - name: Install JS dependencies (same as EAS)
        run: npm ci --include=dev

      - name: Typecheck & tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Generate tvOS project
        run: EXPO_TV=1 npx expo prebuild --platform ios --no-install --clean

      - name: Install pods
        run: cd ios && pod install

      - name: Compile (tvOS simulator, unsigned)
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../xcodebuild-tvos.log | grep -E "error:|warning: .*Swift|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ../xcodebuild-tvos.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-tvos-log
          path: xcodebuild-tvos.log
          if-no-files-found: ignore
